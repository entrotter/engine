[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entrotter-engine"
version = "0.1.0"
description = "Local causal simulation and isolated EVM execution"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Entrotter contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
