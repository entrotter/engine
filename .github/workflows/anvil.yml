name: Local EVM integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  evm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Verify real local Anvil without any mainnet keys
        run: PYTHONPATH=src python -m unittest discover -s tests -v
